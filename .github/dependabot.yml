version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
    # Opens PRs only. Nothing merges without review (branch protection on main).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
