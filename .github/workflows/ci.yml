name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: llms.txt format, launch pages and robots
        run: npm run check:llms
      - name: internal links
        run: npm run check:links
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
